<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Password Generator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="password-card">

        <h2 class="text-center mb-4">
            🔐 Password Generator
        </h2>

        <!-- Password Length -->
        <div class="mb-3">
            <label for="passwordLength" class="form-label">
                Password Length:
            </label>

            <input
                type="number"
                id="passwordLength"
                class="form-control"
                min="4"
                max="100"
                value="16"
            >
        </div>

        <!-- Options -->
        <div class="options mb-3">

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeNumbers"
                    checked
                >
                <label class="form-check-label" for="includeNumbers">
                    Include Numbers
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeUppercase"
                    checked
                >
                <label class="form-check-label" for="includeUppercase">
                    Include Uppercase
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeSpecial"
                    checked
                >
                <label class="form-check-label" for="includeSpecial">
                    Include Special Characters
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="excludeAmbiguous"
                >
                <label class="form-check-label" for="excludeAmbiguous">
                    Exclude Ambiguous Characters
                    <small>(e.g. l, 1, I, O, 0)</small>
                </label>
            </div>

        </div>

        <!-- Generate Button -->
        <button
            id="generateBtn"
            class="btn btn-primary w-100 mb-3"
        >
            Generate Password
        </button>

        <!-- Generated Password -->
        <div class="mb-2">
            <label for="generatedPassword" class="form-label">
                Generated Password:
            </label>

            <input
                type="text"
                id="generatedPassword"
                class="form-control"
                readonly
                placeholder="Your password will appear here"
            >
        </div>

        <!-- Show Password -->
        <div class="form-check mb-3">
            <input
                class="form-check-input"
                type="checkbox"
                id="showPassword"
                checked
            >

            <label class="form-check-label" for="showPassword">
                Show Password
            </label>
        </div>

        <!-- Strength -->
        <div class="strength-container">

            <div class="progress">
                <div
                    id="strengthBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%"
                ></div>
            </div>

            <div
                id="strengthText"
                class="strength-text mt-2"
            >
                Generate a password
            </div>

        </div>

        <!-- Copy Button -->
        <button
            id="copyBtn"
            class="btn btn-outline-secondary mt-3"
            disabled
        >
            Copy
        </button>

        <div id="copyMessage" class="copy-message"></div>

    </div>
</div>

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
