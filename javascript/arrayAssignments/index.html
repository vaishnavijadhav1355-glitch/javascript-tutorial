<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container p-3">
        <h1 class="display-4 text-center">1. To-Do List Manager</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter Task" id="inputTask">
                <button class="btn btn-primary me-2" onclick="addNewTask()">Add Task</button>
                <button class="btn btn-primary" onclick="clearALL()">Clear All</button>
            </div>
            <ul id="lists"></ul>
        </div>
    </div>


    <hr>
<!--  2. marks -->
    <div class="container text-center mt-5">
        <h1 class="display-4 text-center">2. Student Marks Calculator</h1>
        <input type="number" id="markInput" placeholder="Enter a mark">

    <button onclick="addMark()">Add Mark</button>
    <button onclick="calculateMarks()">Calculate</button>
    <button onclick="resetMarks()">Reset</button>

    <div id="result" class="result">
        <p>Total Marks: 0</p>
        <p>Average Marks: 0</p>
        <p>Highest Mark: 0</p>
        <p>Lowest Mark: 0</p>
    </div>
</div>
<hr class="my-5">

    
<!--  3. Search  -->
<div class="container text-center mt-5">
    <h1 class="display-4 text-center">3. Search in an Array</h1>

    <input type="text" id="searchInput" placeholder="Search">
    <button onclick="searchItem()">Search</button>

    <div id="searchResult"></div>
</div>
<hr class="my-5">


<!--  4. Filter odd and Even  -->
<div class="container mt-5">

    <h1 class="display-3 text-center mb-5">
        4. Filter Even and Odd Numbers
    </h1>

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="d-flex justify-content-center gap-2 mb-4">
                <input type="number" id="numberInput"
                       class="form-control w-25"
                       placeholder="Enter a number">

                <button class="btn btn-primary" onclick="addNumber()">Add Number</button>
                <button class="btn btn-primary" onclick="showEven()">Show Even</button>
                <button class="btn btn-primary" onclick="showOdd()">Show Odd</button>
                <button class="btn btn-primary" onclick="clearData()">Clear</button>
            </div>

            <h3>Even Numbers</h3>
            <div id="evenBox" class="result-box"></div>

            <br>

            <h3>Odd Numbers</h3>
            <div id="oddBox" class="result-box"></div>

        </div>
    </div>

</div>
<hr class="my-5">

<!--  5. Sort names alphabetically -->
<div class="container mt-5">

    <h1 class="display-3 text-center mb-5">
        5. Sort Names Alphabetically
    </h1>

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">

                <input type="text"
                       id="nameInput"
                       class="form-control"
                       style="max-width:250px;"
                       placeholder="Enter a name">

                <button class="btn btn-primary" onclick="addStudentName()">Add Name</button>
                <button class="btn btn-primary" onclick="sortStudentNames()">Sort</button>
                <button class="btn btn-primary" onclick="resetStudentNames()">Reset</button>

            </div>

            <div id="nameList" class="result-box"></div>

        </div>
    </div>

</div>
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
