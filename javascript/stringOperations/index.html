<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Operations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <h1 class="text-primary text-center p-4">
        String Operations in JavaScript
    </h1>

    <div class="container w-50">

        <div class="mb-3">
            <label for="inputPara" class="form-label">
                Enter Text
            </label>

            <textarea class="form-control"
                id="inputPara"
                rows="5"
                placeholder="Enter your text here..."></textarea>
        </div>

        <div id="result"
            class="bg-secondary text-white p-3 rounded"
            style="min-height:120px;">
            Result will show here...
        </div>

    </div>

    <div class="container w-75 mt-4">

        <!-- Row 1 -->
        <div class="row g-3">

            <div class="col-md-3 d-grid">
                <button class="btn btn-primary"
                    onclick="convertToUpperCase()">
                    Convert To Upper Case
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-primary"
                    onclick="convertLowerCase()">
                    Convert To Lower Case
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-primary"
                    onclick="convertCamelCase()">
                    Convert To Camel Case
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-primary"
                    onclick="extractFirstWord()">
                    Extract First Word
                </button>
            </div>

        </div>

        <!-- Row 2 -->
        <div class="row g-3 mt-2">

            <div class="col-md-3 d-grid">
                <button class="btn btn-success"
                    onclick="countLines()">
                    Count Lines
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-success"
                    onclick="countVowels()">
                    Count Vowels
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-success"
                    onclick="countConsonants()">
                    Count Consonants
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-success"
                    onclick="extractSpecialCharacters()">
                    Special Characters
                </button>
            </div>

        </div>

        <!-- Row 3 -->
        <div class="row g-3 mt-2">

            <div class="col-md-3 d-grid">
                <button class="btn btn-warning"
                    onclick="CheckPalindrom()">
                    Check Palindrome
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-warning"
                    onclick="countSpaces()">
                    Count Spaces
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-warning"
                    onclick="replaceSpaces()">
                    Replace Spaces
                </button>
            </div>

            <div class="col-md-3 d-grid">
                <button class="btn btn-warning"
                    onclick="sortWords()">
                    Sort Words
                </button>
            </div>

        </div>

    </div>

    <script src="scripts.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
