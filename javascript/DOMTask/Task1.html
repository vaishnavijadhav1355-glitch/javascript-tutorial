<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Task</title>
</head>
<body>

    <h1 id="heading">Welcome Student</h1>

    <button id="changeBtn">Change Heading</button>

    <script>
        // Select the heading and button
        const heading = document.getElementById("heading");
        const button = document.getElementById("changeBtn");

        // Change heading when button is clicked
        button.addEventListener("click", function() {
            heading.textContent = "Welcome to JavaScript DOM";
        });
    </script>

</body>
</html>
